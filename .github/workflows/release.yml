name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read
  # buildhost authenticates this workflow with an OIDC token, so no static registry credential exists here.
  id-token: write

# Releases go to buildhost, never GitHub Releases: an org ruleset blocks v* tags, and a release is a tag.
jobs:
  # One job: a matrix would need a job-to-job hand-off, and artifact storage is banned org-wide.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build every platform
        run: |
          mkdir -p binaries
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            GOOS="$os" GOARCH="$arch" go build -o "binaries/gh-wait-ci-${os}-${arch}${ext}" .
          done
          ls -l binaries

      - uses: actions/github-script@v7
        id: oidc
        with:
          script: return await core.getIDToken('https://pazer.build')

      - name: Publish to buildhost
        env:
          BUILDHOST_TOKEN: ${{ steps.oidc.outputs.result }}
          VERSION: ${{ github.run_number }}
        run: |
          curl -fsSL "https://dl.pazer.build/buildhost?os=linux&arch=amd64" -o /tmp/buildhost
          chmod +x /tmp/buildhost
          # One version holds every platform: an auto-assigned version per platform would each hold a single os/arch.
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            /tmp/buildhost publish \
              --server https://pazer.build \
              --token "$BUILDHOST_TOKEN" \
              --project gh-wait-ci \
              --version "$VERSION" \
              --os "$os" --arch "$arch" \
              --git-branch "${GITHUB_REF_NAME}" \
              --git-commit "${GITHUB_SHA}" \
              --artifact "binaries/gh-wait-ci-${os}-${arch}${ext}"
          done
