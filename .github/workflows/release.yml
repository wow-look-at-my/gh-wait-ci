name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

# One job builds every platform and publishes the release. A build matrix needs
# a job-to-job hand-off, and the only hand-off GitHub offers for built files is
# artifact storage, which this org must never use: the quota is org-wide accrued
# GB-hours, deleting artifacts cannot free it, and exhausting it fails every
# upload step in every repository until the billing cycle resets. Go
# cross-compiles in seconds, so the matrix bought nothing here anyway.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Calculate next version
        id: next_tag
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            num=0
          else
            num=${latest#v}
          fi
          echo "tag=v$((num + 1))" >> "$GITHUB_OUTPUT"

      - name: Build every platform
        run: |
          mkdir -p binaries
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            GOOS="$os" GOARCH="$arch" go build -o "binaries/gh-wait-ci-${os}-${arch}${ext}" .
          done
          ls -l binaries

      # The runner's own gh, not a third-party release action: the org's
      # allowlist admits only PazerOP/*, wow-look-at-my/* and GitHub-owned
      # actions.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.next_tag.outputs.tag }}" \
            --title "${{ steps.next_tag.outputs.tag }}" \
            --generate-notes \
            binaries/*
