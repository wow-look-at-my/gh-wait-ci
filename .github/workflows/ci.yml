name: CI

on:
  push:
  workflow_dispatch:

# go-toolchain's autorelease is default-on and needs every grant past id-token.
permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  # go-toolchain builds, vets, tests with coverage, and runs the dats/ suite
  # sandboxed -- which is what covers the command line here.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master
