name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vends GO_BUILDCACHE_CONFIG, without which go-toolchain refuses to start.
      - uses: wow-look-at-my/actions@secret-server#latest

      # Publishing 403s until an operator re-pins buildhost's gh-wait-ci project off owner 6569500, this repo's owner before the transfer.
      - uses: wow-look-at-my/go-toolchain@master
        with:
          autorelease: 'false'

      - name: Install bats
        run: sudo apt-get install -y bats

      # Drives the built binary, so the shipped artifact is exercised as a user runs it.
      - name: End-to-end tests
        run: bats tests/
