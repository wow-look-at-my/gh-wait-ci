name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  # go-toolchain builds, vets, tests with coverage, and runs the dats/ suite sandboxed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vends GO_BUILDCACHE_CONFIG, without which go-toolchain refuses to start.
      - uses: wow-look-at-my/actions@secret-server#latest

      - uses: wow-look-at-my/go-toolchain@master

      - name: Install bats
        run: sudo apt-get install -y bats

      # Drives the built binary, so the shipped artifact is exercised as a user runs it.
      - name: End-to-end tests
        run: bats tests/
