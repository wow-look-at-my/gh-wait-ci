name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Plain go, not go-toolchain: its bootstrap requires the org's
      # GO_BUILDCACHE_CONFIG, which this repository has no way to obtain, and it
      # fails its integrity probe without it. Run go-toolchain locally for the
      # vet pass and the coverage gate; CI gates the suite itself.
      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o build/gh-wait-ci .

      - name: Install bats
        run: sudo apt-get install -y bats

      # The bats suite drives the built binary through the same stub `gh` the Go
      # suite uses, so the shipped artifact is exercised as a user runs it.
      - name: End-to-end tests
        run: bats tests/
