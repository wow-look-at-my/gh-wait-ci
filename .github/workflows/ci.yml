name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go-toolchain's bootstrap probes the org build cache and refuses to run
      # without GO_BUILDCACHE_CONFIG. secret-server vends it against this
      # workflow's OIDC identity, so no repository secret is involved.
      - uses: wow-look-at-my/actions@secret-server#latest

      - uses: wow-look-at-my/go-toolchain@master

      - name: Install bats
        run: sudo apt-get install -y bats

      # The bats suite drives the built binary through the same stub `gh` the Go
      # suite uses, so the shipped artifact is exercised as a user runs it.
      - name: End-to-end tests
        run: bats tests/
